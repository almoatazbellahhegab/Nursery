[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nursery-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.119.0", "uvicorn==0.37.0", "psycopg[binary]==3.3.6", "sqlalchemy==2.1.6", "alembic==1.20.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1", "mypy==1.18.2", "ruff==0.14.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/nursery_api"]

[tool.mypy]
strict = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
